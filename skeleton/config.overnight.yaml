# Ireland is the first no-relocation expansion. TechJobs.ie is a current,
# crawlable specialist board with full requirements and employer application links.
techjobsie:
  timeout_seconds: 30
  minimum_poll_minutes: 30
  detail_request_interval_seconds: 0.2
  categories: [ai, data-engineering, devops, platform-infrastructure, security, back-end-development, full-stack]

# Ireland's state employment service is scanned across every industry so AI,
# automation and technical roles inside ordinary employers are not missed.
jobsireland:
  timeout_seconds: 45
  minimum_poll_minutes: 60
  page_size: 250
  discovery_workers: 4
  detail_request_interval_seconds: 1.0

# Public-service requirements frequently live in candidate-booklet PDFs.  The
# adapter preserves the vacancy page, attachment URLs and extracted PDF text.
publicjobsie:
  timeout_seconds: 45
  minimum_poll_minutes: 60
  detail_request_interval_seconds: 0.5
  extract_pdf_attachments: true

