extends: config.additional.yaml

io:
  job_urls: scraper/data_overnight/job_urls.jsonl
  raw_cache: scraper/data_overnight/raw_cache
  viability_manifest: scraper/data_overnight/viability.jsonl
  processing_job_urls: scraper/data_overnight/viable_job_urls.jsonl
  jobs: scraper/data_overnight/jobs.jsonl
  database: scraper/data_overnight/jobs.sqlite3
  jobs_scored: skeleton/data_overnight/jobs_scored.jsonl
  outputs_dir: outputs/overnight

boards:
  enabled: [greenhouse, lever, smartrecruiters, ashby, workable, recruitee, personio, workday, guardianjobs, nhsjobs, jobsacuk, techjobsie, jobsireland, publicjobsie, iamexpatnl, uprotterdam, academictransfer, werkenvoornederland, magnetme, undutchables, graduatenl, itjobsch, itboardch, swissaijob, developerjobsch, swissfederal, arbeitnow, jobicy, remotive, himalayas, muse, weworkremotely, remoteok, remotefirst, adzuna, reed, jooble]
  mode: live
  rate_limit_seconds: 0.25
  max_jobs_total: 0

llm:
  backend: codex_cli
  model: gpt-5.6-sol
  codex_model: gpt-5.6-sol
  cli_timeout_seconds: 300
  temperature: 0.0
  cache: true
  max_retries: 2

collection:
  source_workers: 22
  fetch_workers: 24
  poll_minutes: 15

# Full upstream Scrapling is a failure-recovery layer for detail pages that a
# board adapter cannot retrieve. Every stage receives its kwargs unchanged;
# custom Python values can use the worker's $ref/$proxy_rotator JSON forms.
# Successful and failed attempts retain full headers, cookies, redirects,
# binary body, decoded text and captured XHR responses in the raw cache.
scrapling:
  enabled: true
  runtime_python: .venv-scrapling/bin/python
  worker_module: scraper.scrapling_worker
  command_timeout_seconds: 240
  minimum_body_bytes: 128
  fallback_chain:
    - engine: static
      method: get
      timeout_seconds: 60
      kwargs:
        timeout: 45
        retries: 3
        retry_delay: 1
        impersonate: chrome
        stealthy_headers: true
        follow_redirects: safe
        selector_config:
          adaptive: true
          storage_args:
            storage_file: scraper/data_overnight/scrapling_elements.sqlite3
    - engine: dynamic
      timeout_seconds: 150
      kwargs:
        headless: true
        timeout: 90000
        retries: 2
        retry_delay: 1
        load_dom: true
        network_idle: false
        disable_resources: false
        capture_xhr: ".*"
        locale: en-GB
        timezone_id: Europe/London
        selector_config:
          adaptive: true
          storage_args:
            storage_file: scraper/data_overnight/scrapling_elements.sqlite3
    - engine: stealth
      timeout_seconds: 240
      kwargs:
        headless: true
        timeout: 120000
        retries: 2
        retry_delay: 1
        load_dom: true
        network_idle: false
        disable_resources: false
        capture_xhr: ".*"
        locale: en-GB
        timezone_id: Europe/London
        solve_cloudflare: true
        allow_webgl: true
        hide_canvas: true
        block_webrtc: true
        dns_over_https: false
        selector_config:
          adaptive: true
          storage_args:
            storage_file: scraper/data_overnight/scrapling_elements.sqlite3

