[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "job-application-automation"
version = "1.0.0"
description = "Job Application Automation control plane and audited ATS executor."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Proprietary" }
dependencies = [
    "cryptography==49.0.0",
    "playwright==1.62.0",
    "pyyaml==6.0.3",
    "requests==2.32.5",
    "openpyxl==3.1.5",
    "pypdf==6.6.0",
]

[project.optional-dependencies]
# Optional reporting and LLM-schema helpers. The supported browser runtime is core.
full = ["matplotlib==3.10.5", "jsonschema==4.25.0"]

[project.scripts]
# Market Aligner owns its own CLI. JAA exposes only JAA-owned commands.
jaa-baseline = "baseline_adoption.cli:main"
jaa-lifecycle = "career_automation.cli:main"
jaa-handoff = "career_automation.handoff_cli:main"
jaa-official-cohort = "career_automation.official_cohort:main"
jaa-document-assurance = "career_automation.external_document_assurance:main"

[tool.setuptools]
py-modules = ["tracked_source_revision"]
packages = [
    "baseline_adoption",
    "career_automation",
    "cv_generation",
    "form_filling",
    "jaa_core",
    "skeleton",
    "scraper",
    "scraper.adapters",
    "llm",
    "profiler",
    "profiler.instrument",
]

[tool.setuptools.package-data]
skeleton = ["config.yaml", "config.additional.yaml", "config.lever.yaml", "config.overnight.yaml", "fixtures/jobs_20.jsonl"]
scraper = ["fixtures/*.json", "fixtures/*/*.json"]
llm = ["prompts/*.txt", "schemas/*.json"]
career_automation = ["fixtures/*.json", "fixtures/provider-observation-capture-objects/*.json", "fixtures/jaa04_authority_canaries/ashby.json", "fixtures/jaa04_authority_canaries/greenhouse.json", "fixtures/jaa04_authority_canaries/workable.json"]
