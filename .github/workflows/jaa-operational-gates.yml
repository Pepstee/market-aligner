name: JAA operational gates

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: jaa-operational-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generic-contract:
    name: CPython 3.12 locked generic contract
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.13"
      - name: Build an isolated wheel environment
        run: |
          TEST_ENV="$RUNNER_TEMP/jaa-generic" \
          PYTHON_BOOTSTRAP=python \
          sh internal/jaa/scripts/bootstrap-test-env.sh
      - name: Run the browser-free contract gate
        run: |
          JAA_TEST_PYTHON="$RUNNER_TEMP/jaa-generic/bin/python" \
          sh internal/jaa/scripts/run-generic-gate.sh

  greenhouse-fixture:
    name: Pinned Chromium synthetic Greenhouse corridor
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.13"
      - name: Build an isolated wheel and browser environment
        run: |
          TEST_ENV="$RUNNER_TEMP/jaa-browser" \
          PLAYWRIGHT_BROWSERS_PATH="$RUNNER_TEMP/jaa-browser/browsers" \
          INSTALL_BROWSER=1 \
          INSTALL_BROWSER_DEPS=1 \
          PYTHON_BOOTSTRAP=python \
          sh internal/jaa/scripts/bootstrap-test-env.sh
      - name: Run the synthetic browser fixture gate
        run: |
          PLAYWRIGHT_BROWSERS_PATH="$RUNNER_TEMP/jaa-browser/browsers" \
          JAA_TEST_PYTHON="$RUNNER_TEMP/jaa-browser/bin/python" \
          sh internal/jaa/scripts/run-browser-fixture-gate.sh
