[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "market-aligner"
version = "1.0.0"
description = "Evidence-led, configurable UK AI/IT vacancy matcher."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
dependencies = [
    "pyyaml==6.0.3",
    "requests==2.32.5",
    "openpyxl==3.1.5",
    "pypdf==6.6.0",
]

[project.optional-dependencies]
# Playwright boards (jobkorea, notefolio) + the Fit/Opportunity scatter.
full = ["playwright>=1.40", "matplotlib>=3.8", "jsonschema>=4.20"]

[project.scripts]
market-aligner = "skeleton.run:main"
uk-job-matcher = "skeleton.run:main"
jaa-baseline = "baseline_adoption.cli:main"
jaa-lifecycle = "career_automation.cli:main"

[tool.setuptools]
packages = [
    "baseline_adoption",
    "career_automation",
    "skeleton",
    "scraper",
    "scraper.adapters",
    "llm",
    "profiler",
    "profiler.instrument",
]

[tool.setuptools.package-data]
skeleton = ["config.yaml"]
llm = ["prompts/*.txt", "schemas/*.json"]
career_automation = ["fixtures/*.json"]
